<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Parcours Parisien</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paris: {
                            gold: '#C5A059',
                            dark: '#1C1C1C',
                            cream: '#F9F6F0'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <!-- Leaflet CSS & JS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom map styles */
        #map { z-index: 10; }
        .leaflet-popup-content-wrapper { border-radius: 1rem; }
        
        /* Smooth scrolling for sidebar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animated marker CSS */
        .moving-marker-icon {
            background-color: #d97706; /* amber-600 */
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.1s linear;
        }

    </style>
    <!-- Adding Playfair Display for elegant headings -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen w-full flex flex-col md:flex-row overflow-hidden">

    <!-- Toast Notification (Hidden by default) -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg z-[9999] opacity-0 transition-opacity duration-300 pointer-events-none flex items-center space-x-2">
        <i class="fas fa-check-circle text-green-400"></i>
        <span id="toast-message">Lien copié !</span>
    </div>

    <!-- Sidebar / Bottom Panel -->
    <div class="w-full md:w-96 lg:w-[400px] h-[45vh] md:h-full bg-white shadow-xl z-20 flex flex-col relative">
        
        <!-- Header -->
        <div class="p-6 bg-paris-dark text-white shadow-md z-10">
            <h1 class="text-2xl font-serif mb-1"><i class="fa-solid fa-map-location-dot mr-2 text-paris-gold"></i> Mon Trajet Parisien</h1>
            <p class="text-sm text-gray-300 opacity-90">Week-end à Paris · carte interactive</p>
        </div>

        <!-- Itinerary List -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar bg-paris-cream" id="waypoint-list">
            <!-- Items injected by JS -->
        </div>

        <!-- Action Buttons Footer -->
        <div class="p-4 bg-white border-t border-gray-100 flex flex-col gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <button id="btn-play" class="w-full py-3 bg-paris-dark text-white rounded-xl font-medium hover:bg-black transition-colors flex items-center justify-center space-x-2 shadow-md">
                <i class="fas fa-play text-paris-gold"></i>
                <span>Démarrer le trajet</span>
            </button>
            <button id="btn-share" class="w-full py-3 bg-white border border-gray-200 text-gray-700 rounded-xl font-medium hover:bg-gray-50 transition-colors flex items-center justify-center space-x-2 shadow-sm">
                <i class="fas fa-share-nodes text-paris-gold"></i>
                <span>Partager la carte</span>
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map" class="w-full h-[55vh] md:flex-1 relative bg-gray-200"></div>

    <script>
        // --- DATA MODEL ---
        // Easy to add more waypoints here later
        const waypoints = [
            {
                id: 1, name: "Mia Matcha (Pop-up store Samaritaine)",
                address: "9 R. de la Monnaie, 75001 Paris",
                lat: 48.8590, lng: 2.3427,
                note: "Pop-up à la Samaritaine. Ouverture à 11h.",
                question: "Quelle heure arrive-t-on ?", estimatedTime: "11:00", icon: "fa-mug-hot"
            },
            {
                id: 2, name: "Pop-up store Studio Ghibli",
                address: "15 Rue des Halles, 75001 Paris",
                lat: 48.8604, lng: 2.3466,
                note: "Ouverture à 11h30.",
                question: "Quelle heure arrive-t-on ?", estimatedTime: "11:30", icon: "fa-wand-magic-sparkles"
            },
            {
                id: 3, name: "Rôtisserie Segar",
                address: "111 Rue Mouffetard, 75005 Paris",
                lat: 48.8413, lng: 2.3501,
                note: "Repas de midi.",
                question: "Quelle heure arrive-t-on ?", estimatedTime: "12:30", icon: "fa-drumstick-bite"
            },
            {
                id: 4, name: "Chez Alain Miam Miam",
                address: "26 Rue Charlot, 75003 Paris",
                lat: 48.8631, lng: 2.3636,
                note: "Alternative pour le repas de midi (à la place de Segar).",
                question: "Quelle heure arrive-t-on ?", estimatedTime: "12:30", icon: "fa-bread-slice",
                alt: true
            },
            {
                id: 5, name: "Le Live Cinema",
                address: "226 Rue Saint-Denis, 75002 Paris",
                lat: 48.8662, lng: 2.3517,
                note: "L'activité commence à 15h50 : être sur place pour 15h40.",
                question: "Quelle heure arrive-t-on ?", estimatedTime: "15:40", icon: "fa-film"
            }
        ];

        // Étapes principales (hors alternatives) : utilisées pour le tracé et l'animation
        const mainPts = waypoints.filter(w => !w.alt);
        function labelOf(wp) {
            if (!wp.alt) return String(mainPts.indexOf(wp) + 1);
            // alternative : numéro de l'étape principale précédente + "b"
            const prev = waypoints.slice(0, waypoints.indexOf(wp)).filter(w => !w.alt).length;
            return prev + 'b';
        }
        function markerOf(wp) { return markers[waypoints.indexOf(wp)]; }

        function mapsLink(wp) {
            return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(wp.name + ', ' + wp.address) + '&travelmode=walking';
        }

        // --- STATE ---
        let map;
        let routeLine;
        let animatedMarker;
        const markers = []; // To store static markers
        
        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderSidebar();
            setupEventListeners();
        });

        function initMap() {
            // Center roughly on Paris center initially
            map = L.map('map', {
                zoomControl: false // Custom position later if needed
            }).setView([48.8566, 2.3522], 13);
            
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Fond de carte : OpenStreetMap, avec CARTO (sans clé) en secours
            const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);
            let switched = false;
            osm.on('tileerror', () => {
                if (switched) return;
                switched = true;
                map.removeLayer(osm);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                    subdomains: 'abcd',
                    maxZoom: 20
                }).addTo(map);
            });

            // Add static markers for all waypoints
            waypoints.forEach((wp, index) => {
                const markerIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="${wp.alt ? "bg-white text-paris-dark border-dashed" : "bg-paris-dark text-white"} rounded-full w-8 h-8 flex items-center justify-center border-2 border-paris-gold shadow-md">
                             <span class="font-bold text-sm">${labelOf(wp)}</span>
                           </div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([wp.lat, wp.lng], { icon: markerIcon }).addTo(map);
                
                // Build popup content
                const popupContent = `
                    <div class="p-1 min-w-[200px]">
                        <h3 class="font-serif font-semibold text-lg text-paris-dark mb-1">${wp.name}</h3>
                        <p class="text-xs text-gray-500 mb-2"><i class="fas fa-location-dot mr-1"></i>${wp.address}</p>
                        ${wp.note ? `<div class="bg-amber-50 border-l-2 border-amber-400 p-2 text-sm text-amber-800 mb-2">${wp.note}</div>` : ''}
                        ${wp.question ? `<p class="text-sm font-medium mb-1 mt-2 text-paris-dark">${wp.question}</p>` : ''}
                        <a href="${mapsLink(wp)}" target="_blank" rel="noopener" class="inline-block text-sm text-blue-600 underline mb-2"><i class="fas fa-route mr-1"></i>Y aller (Google Maps)</a>
                        <div class="flex items-center space-x-2 mt-1">
                            <i class="far fa-clock text-gray-400 text-sm"></i>
                            <input type="time" value="${wp.estimatedTime}" data-wp="${wp.id}" onchange="updateTime(${wp.id}, this.value)" class="border border-gray-300 rounded px-2 py-1 text-sm outline-none focus:border-paris-gold w-full text-center">
                        </div>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markers.push(marker);
            });

            // Adjust map view to fit all markers
            if (waypoints.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 16 });
            }

            // Tracé principal (étapes hors alternatives)
            if (mainPts.length > 1) {
                routeLine = L.polyline(mainPts.map(wp => [wp.lat, wp.lng]), {color: '#1C1C1C', weight: 3, dashArray: '5, 10', opacity: 0.6}).addTo(map);
            }
            // Tracé pointillé doré via chaque alternative
            waypoints.forEach((wp, i) => {
                if (!wp.alt) return;
                const before = waypoints.slice(0, i).filter(w => !w.alt).pop();
                const after = waypoints.slice(i + 1).find(w => !w.alt);
                const pts = [before, wp, after].filter(Boolean).map(w => [w.lat, w.lng]);
                L.polyline(pts, {color: '#C5A059', weight: 2, dashArray: '2, 8', opacity: 0.8}).addTo(map);
            });
        }

        // --- UI RENDERING ---
        function renderSidebar() {
            const listContainer = document.getElementById('waypoint-list');
            listContainer.innerHTML = '';

            waypoints.forEach((wp, index) => {
                const isFirst = index === 0;
                
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 transition-all hover:shadow-md cursor-pointer";
                card.onclick = (e) => {
                    // Prevent map jump if clicking on the time input itself
                    if(e.target.type !== 'time') focusOnWaypoint(wp.id);
                };
                
                card.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="flex flex-col items-center">
                            <div class="w-8 h-8 rounded-full bg-${isFirst ? 'paris-dark' : 'gray-200'} text-${isFirst ? 'paris-gold' : 'gray-600'} flex items-center justify-center font-bold text-sm shadow-inner z-10 relative">
                                ${labelOf(wp)}
                            </div>
                            ${index < waypoints.length - 1 ? '<div class="w-0.5 h-16 bg-gray-200 mt-2"></div>' : ''}
                        </div>
                        <div class="flex-1 pb-2">
                            <h3 class="font-serif font-semibold text-lg text-gray-800 leading-tight mb-1">${wp.name}${wp.alt ? ' <span class="text-xs font-sans font-medium bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full align-middle">Option</span>' : ''}</h3>
                            <p class="text-xs text-gray-500 mb-3"><i class="fas fa-location-dot mr-1"></i>${wp.address}</p>
                            
                            <a href="${mapsLink(wp)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="inline-block text-xs text-blue-600 underline mb-3"><i class="fas fa-route mr-1"></i>Y aller (Google Maps)</a>
                            ${wp.note ? `
                                <div class="text-sm bg-amber-50 text-amber-800 p-2.5 rounded-lg border border-amber-100 mb-3">
                                    <i class="fas fa-info-circle mr-1"></i> ${wp.note}
                                </div>
                            ` : ''}
                            
                            ${wp.question ? `
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">${wp.question}</label>
                                    <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-md px-3 py-1.5 focus-within:ring-2 focus-within:ring-paris-gold focus-within:border-transparent transition-all">
                                        <i class="far fa-clock text-gray-400"></i>
                                        <input type="time" value="${wp.estimatedTime}" data-wp="${wp.id}" onchange="updateTime(${wp.id}, this.value)" class="w-full outline-none text-gray-700 text-center font-medium bg-transparent">
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // --- INTERACTIONS & LOGIC ---
        
        function updateTime(id, newTime) {
            // Update the state
            const wp = waypoints.find(w => w.id === id);
            if(wp) {
                wp.estimatedTime = newTime;
                document.querySelectorAll(`input[data-wp="${id}"]`).forEach(el => { if (el.value !== newTime) el.value = newTime; });
                // If we want to keep sidebar and popup strictly in sync, we could re-render
                // For now, since they manipulate the same data model, it's fine.
            }
        }

        function focusOnWaypoint(id) {
            const index = waypoints.findIndex(w => w.id === id);
            if (index !== -1 && markers[index]) {
                const wp = waypoints[index];
                map.flyTo([wp.lat, wp.lng], 16, { duration: 1 });
                setTimeout(() => markers[index].openPopup(), 1000);
            }
        }

        function setupEventListeners() {
            document.getElementById('btn-share').addEventListener('click', shareRoute);
            document.getElementById('btn-play').addEventListener('click', startAnimation);
        }

        // --- ANIMATION LOGIC ---
        let animationInterval;
        
        function startAnimation() {
            if (mainPts.length === 0) return;

            // Clear previous animation
            if (animatedMarker) {
                map.removeLayer(animatedMarker);
            }
            if (animationInterval) {
                clearInterval(animationInterval);
            }

            // Create moving marker
            const movingIcon = L.divIcon({
                className: 'moving-marker',
                html: '<div class="moving-marker-icon w-4 h-4"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            if (mainPts.length === 1) {
                // Only one point: Just fly to it and drop the marker
                const target = mainPts[0];
                map.flyTo([target.lat, target.lng], 16, { duration: 1.5 });
                
                setTimeout(() => {
                    animatedMarker = L.marker([target.lat, target.lng], { icon: movingIcon, zIndexOffset: 1000 }).addTo(map);
                    // Add a tiny bounce effect using CSS class addition
                    const iconEl = animatedMarker.getElement().querySelector('.moving-marker-icon');
                    iconEl.style.transform = 'scale(1.5)';
                    setTimeout(() => iconEl.style.transform = 'scale(1)', 200);
                    showToast("Arrivée à la première étape !");
                    markerOf(mainPts[0]).openPopup();
                }, 1500);

            } else {
                // Multiple points: Animate along the path
                let currentPointIndex = 0;
                let progress = 0;
                const steps = 60; // Steps between points
                
                animatedMarker = L.marker([mainPts[0].lat, mainPts[0].lng], { icon: movingIcon, zIndexOffset: 1000 }).addTo(map);
                
                // Center map on start
                map.setView([mainPts[0].lat, mainPts[0].lng], 15);

                animationInterval = setInterval(() => {
                    if (currentPointIndex >= mainPts.length - 1) {
                        clearInterval(animationInterval);
                        showToast("Trajet terminé !");
                        return;
                    }

                    const startWp = mainPts[currentPointIndex];
                    const endWp = mainPts[currentPointIndex + 1];
                    
                    progress += 1 / steps;

                    if (progress >= 1) {
                        progress = 0;
                        currentPointIndex++;
                        if(markerOf(mainPts[currentPointIndex])) markerOf(mainPts[currentPointIndex]).openPopup();
                        // Pan map to new point
                        if (currentPointIndex < mainPts.length - 1) {
                            map.panTo([mainPts[currentPointIndex].lat, mainPts[currentPointIndex].lng]);
                        }
                    } else {
                        // Linear interpolation
                        const lat = startWp.lat + (endWp.lat - startWp.lat) * progress;
                        const lng = startWp.lng + (endWp.lng - startWp.lng) * progress;
                        animatedMarker.setLatLng([lat, lng]);
                    }

                }, 20); // 20ms frame rate
            }
        }

        // --- UTILS (SHARE / TOAST) ---
        function shareRoute() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ title: document.title, url: currentUrl }).catch(() => {});
                return;
            }
            
            // Fallback copy method
            const copyToClipboard = (text) => {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        return navigator.clipboard.writeText(text);
                    } else {
                        let textArea = document.createElement("textarea");
                        textArea.value = text;
                        textArea.style.position = "fixed";
                        textArea.style.left = "-999999px";
                        textArea.style.top = "-999999px";
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        return new Promise((res, rej) => {
                            document.execCommand('copy') ? res() : rej();
                            textArea.remove();
                        });
                    }
                } catch (e) {
                    return Promise.reject(e);
                }
            };

            copyToClipboard(currentUrl)
                .then(() => showToast("Lien de la carte copié ! (Prêt à partager)"))
                .catch(() => showToast("Erreur lors de la copie du lien.", true));
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = toast.querySelector('i');
            
            msgEl.textContent = message;
            
            if (isError) {
                iconEl.className = 'fas fa-exclamation-circle text-red-400';
            } else {
                iconEl.className = 'fas fa-check-circle text-green-400';
            }

            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

    </script>
</body>
</html>
